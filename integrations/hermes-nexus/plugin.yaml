name: hermes-nexus
version: 0.1.0
description: Read-only architect pilot tools for bounded Hermes Nexus task context and impact evidence.
author: hermes-nexus
kind: standalone
provides_tools:
  - project_task_context
  - project_impact
config_schema:
  base_url:
    type: str
    required: true
    description: Explicit local Nexus URL, for example http://127.0.0.1:8770.
  scope_enabled:
    type: bool
    required: false
    default: false
    description: Gate for the read-only project_effective_task_scope caller (local compose from accepted pack+impact). Default false; provides_tools remains exactly the two core tools.
